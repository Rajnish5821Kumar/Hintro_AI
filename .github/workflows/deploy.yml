name: Deploy to Production

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '20'
  DOCKER_IMAGE: meeting-intelligence-service

jobs:
  # ─────────────────────────────────────────────────────────────
  # Deploy to Render
  # ─────────────────────────────────────────────────────────────
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'
          echo "Render deployment triggered"

  # ─────────────────────────────────────────────────────────────
  # Build & Push Docker Image (Docker Hub)
  # ─────────────────────────────────────────────────────────────
  docker-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ secrets.DOCKER_USERNAME != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # Post-Deployment Health Check
  # ─────────────────────────────────────────────────────────────
  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: [deploy-render]
    if: ${{ secrets.DEPLOYED_URL != '' }}

    steps:
      - name: Wait for deployment to stabilize
        run: sleep 60

      - name: Health check
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.DEPLOYED_URL }}/health")
          if [ "$RESPONSE" != "200" ]; then
            echo "Health check failed with status: $RESPONSE"
            exit 1
          fi
          echo "Health check passed: HTTP $RESPONSE"

      - name: Evaluation endpoint check
        run: |
          curl -s "${{ secrets.DEPLOYED_URL }}/api/evaluation" | jq .
